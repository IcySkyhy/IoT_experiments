# K8s 部署文件 — 选做任务: 分数收集器 + Web Service
# 部署: kubectl apply -f exp5-collector.yaml
# 访问: http://<云服务器公网IP>:30080

---
# Deployment: 运行在云服务器节点上
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exp5-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exp5-collector
  template:
    metadata:
      labels:
        app: exp5-collector
    spec:
      # 允许调度到有 taint 的 server 节点
      tolerations:
      - key: "key1"
        operator: "Equal"
        value: "value1"
        effect: "NoSchedule"
      # 强制调度到 server 节点
      nodeSelector:
        kubernetes.io/hostname: server
      containers:
      - name: collector
        image: 10.0.0.1:5000/exp5-collector:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
          - name: BROKER_IP
            value: "10.0.0.1"

---
# Service: NodePort 对外暴露 Web 页面
apiVersion: v1
kind: Service
metadata:
  name: exp5-collector-svc
spec:
  type: NodePort
  selector:
    app: exp5-collector
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
