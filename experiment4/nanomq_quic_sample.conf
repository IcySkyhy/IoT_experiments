# NanoMQ QUIC 示例配置（片段）
# 将路径替换为实际证书/密钥，实验环境可暂时关闭证书校验。

mqtt {
    # TCP 监听用于对照测试
    tcp_listen = "0.0.0.0:1883"
}

# 开启 QUIC 监听
quic {
    enable = true
    quic_listen = "quic://0.0.0.0:14567"
    # 证书/密钥（如需关闭校验，可设置 verify_peer = false）
    certfile = "/etc/nanomq/certs/server.crt"
    keyfile  = "/etc/nanomq/certs/server.key"
    cafile   = "/etc/nanomq/certs/ca.crt"
    verify_peer = false
    idle_timeout = 30
    send_idle_timeout = 30
}

log {
    level = info
}
